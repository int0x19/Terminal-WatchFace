<div id="terminal-typography-hierarchy" class="viz-dotted-background" aria-label="Подписи 34, значения 40">
  <style>
    #terminal-typography-hierarchy .terminal-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 12px;
      color: light-dark(#17251d, #e4f4e9);
      font: 14px/1.4 system-ui, sans-serif;
    }
    #terminal-typography-hierarchy .terminal-face {
      display: block;
      width: min(450px, 100%);
      height: auto;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #000;
    }
    #terminal-typography-hierarchy .terminal-spec {
      min-height: 48px;
      text-align: center;
    }
  </style>
  <div class="terminal-stage">
    <img class="terminal-face" width="450" height="450"
         alt="UTC+5 и BATT сверху размером 34, время UTC и заряд ниже размером 40. Дата 40; подписи пяти дополнений 34, значения 40." />
    <div class="terminal-spec" aria-live="polite">Подписи 34 · значения и дата 40</div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('terminal-typography-hierarchy');
      const image = root.querySelector('img');
      const spec = root.querySelector('.terminal-spec');
      const images = __PREVIEW_IMAGES__;
      const state = { revision: 'current', clockFont: 'block' };
      function render() {
        image.src = images[state.revision][state.clockFont];
        spec.textContent = state.revision === 'current'
          ? 'Подписи 34 · значения и дата 40'
          : 'APK 0.9.0: верх 34 · дата и подписи 38 · значения до 42';
      }
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, 'revision', {
          label: 'Сравнение',
          options: [
            { label: 'Новая иерархия', value: 'current' },
            { label: 'Как в APK 0.9.0', value: 'previous' }
          ]
        });
        tweak.addSelect(state, 'clockFont', {
          label: 'Шрифт часов',
          options: [
            { label: 'Блочный', value: 'block' },
            { label: 'Точечный', value: 'dot' },
            { label: 'Контурный', value: 'mono' }
          ]
        });
      }
    })();
  </script>
</div>
